name: jev
version: 0.1.0
description: >
  TypeSafe Jev (System One) — typed decision questions (Noul / Choice / Score)
  against any state. Built for coding agents: triage, routing, failure
  classification, review gating, and merge-readiness checks with calibrated
  probabilities.
author: Anders Jensen-Waud
license: MIT
homepage: https://github.com/ajensenwaud/hermes-jev-plugin
tags: [typesafe, jev, decisions, coding-agent]
provides_tools:
  - jev_evaluate
  - jev_check
  - jev_route
  - jev_score
  - jev_find
requires_env:
  - name: TYPESAFE_API_KEY
    description: TypeSafe API key for the Jev System One API
    url: https://console.typesafe.ai/keys
    secret: true
config_schema:
  model:
    type: str
    default: "jev-latest"
    description: TypeSafe System One model id
  timeout_seconds:
    type: int
    default: 30
    description: HTTP timeout for TypeSafe API calls
  max_questions:
    type: int
    default: 20
    description: Maximum number of questions per jev_evaluate call
  vision_enabled:
    type: bool
    default: false
    description: >-
      Register jev_find (image questions + bounding box). Images and Box are
      Dreamer-ready at TypeSafe: the request format, answers, and limits can
      change between releases. Also needs Pillow.
  vision_model:
    type: str
    default: "jev-preview"
    description: Model for image questions; Box questions must run on Jev 1.14
